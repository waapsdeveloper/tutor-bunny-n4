<ion-header class="ion-no-border ion-no-shadow">
  <app-sd-header-top [showBack]="false" [title]="'Chat'" [backUrl]="'/tabs/teacher-dashboard'"
    [showNotification]="false" [showSearch]="false"></app-sd-header-top>
</ion-header>
<ion-content class="ion-content-bg ion-padding" [fullscreen]="true">
  <div class="body-content">
    <div class="search-box-outer-89655" *ngIf="showChat === 'inbox'">
      <div class="search-box-input-outer">
        <img src="assets/icon/input-search-gray.svg" />
        <input type="text" placeholder="Search by name?" />
      </div>
    </div>
    <div class="chat-top-header-78521" *ngIf="role_id === 3">
      <div class="chat-inbox-78522" ><img src="../../assets/svg/inbox.svg" alt="">Inbox
      </div>
      <div class="chat-inbox-78523" (click)="showRequests()"><img src="../../assets/svg/requests.svg"
          alt="">Requests ({{count}})</div>
    </div>
    <div >
      <app-chat-list *ngFor="let item of chat" [item]="item"></app-chat-list>
    </div>

  </div>
</ion-content>
