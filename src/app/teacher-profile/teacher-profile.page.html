<ion-header class="ion-no-shadow ion-no-border ion-header-bg">
  <div class="top-dashboard-header-outer ion-padding" *ngIf="user">
    <div *ngIf="user" class="image-box-89657" [style.background-image]="'url(' + user.image + ')'">
    </div>
    <div class="header-oblique-double-675">
      <div class="header-line-678576" (click)="openEditProfile()" *ngIf="roleId === 3">
        <div class="header-line-box-678576">
          <img src="../../assets/svg/edit.svg" />
        </div>
      </div>
      <div class="header-info-box-68447">
        <div class="header-info-user-68448">
          <div class="header-info-user-name outfit-semibold ">{{displayName}}</div>
        </div>
        <div class="header-info-misc-68448 outfit"><img src="../../assets/svg/verified-profile-sheild.svg" />Verified on
          23-Jul-2024
        </div>
        <div class="header-info-misc-68448 outfit">
          <img src="../../assets/svg/star.svg" />
          <img src="../../assets/svg/star.svg" />
          <img src="../../assets/svg/star.svg" />
          <img src="../../assets/svg/star.svg" />
          <img src="../../assets/svg/star.svg" />
           5.0 (375)
        </div>
      </div>
    </div>
  </div>
</ion-header>
<ion-content class="ion-content-medium-background">
  <div class="video-box-98563">
    <img src="../../assets/youtube.png" alt="" class="youtube">
  </div>
  <div class="body-content-684488">
    <div class="techer-subject-content">
      <div class="techer-card-outer-78965">
        <div class="teacher-card-head">
          <img src="assets/svg/techer-card.svg" alt="">
          <div class="fs-16 roboto-regular">Teaches:</div>
        </div>
        <div class="chips-outer">
          <div class="chip-outer-78961 fs-16 roboto-regular" *ngFor="let item of subject">{{item?.name}}</div>
        </div>
      </div>
      <div class="techer-card-outer-78965">
        <div class="teacher-card-head">
          <img src="assets/svg/speaks.svg" alt="">
          <div class="fs-16 roboto-regular">Speaks:</div>
        </div>
        <div class="chips-outer">
          <div class="chip-outer-78961 fs-16 roboto-regular" *ngFor="let item of language">{{item?.name}}</div>
        </div>
      </div>
      <div class="techer-card-outer-78965">
        <div class="teacher-card-head">
          <img src="../../assets/svg/bike.svg" alt="">
          <div class="fs-16 roboto-regular">Travel:</div>
        </div>
        <div class="chips-outer">
          <div class="chip-outer-78961 fs-16 roboto-regular" *ngFor="let item of language">{{item?.name}}</div>
        </div>
      </div>
      <div class="techer-card-outer-78965">
        <div class="teacher-card-head">
          <img src="../../assets/svg/locations.svg" alt="">
          <div class="fs-16 roboto-regular" style="text-wrap: nowrap;"><span>{{city}}, {{state}},
              {{country}}</span><span *ngIf="flag" slot="start" class="fi fi-{{flag}}" style="margin-left: 8px;"></span>
          </div>
        </div>
      </div>
    </div>
    <div>
      <app-teacher-profile-statistics></app-teacher-profile-statistics>
    </div>
    <div class="line"></div>
    <div class="fs-16 outfit"
      style="display: flex;    align-items: flex-start;    flex-direction: column;    gap: 16px;">
      <div class="about-heading">About</div>
      <div class="about-para" style="text-wrap: wrap;">
        {{user?.teacher?.title}}
      </div>
    </div>
    <div class="fs-16 outfit discription-text">
      <div class="discription-para" [class.collapsed]="isExpanded">
        {{ user?.teacher?.description }}
      </div>
      <ion-button class="read-more" fill="clear" *ngIf="!isExpanded" (click)="toggleReadMore()">Read More</ion-button>
      <ion-button class="read-more" fill="clear" *ngIf="isExpanded" (click)="toggleReadMore()">Read Less</ion-button>
    </div>
    <div class="read-more" fill="clear" style="padding: 24px;" (click)="openQulification()">
      <img src="../../assets/svg/qulification.svg" alt="">
      <div>View qualifications and experiences</div>
    </div>
    <div class="line"></div>
    <app-my-courses></app-my-courses>
    <div class="line"></div>
    <app-my-gallery *ngIf="showGellary === true" [user]="user"></app-my-gallery>
    <div class="line" *ngIf="showGellary === true"></div>
    <app-rating-review></app-rating-review>
    <!-- <div class="line"></div> -->
  </div>
</ion-content>
