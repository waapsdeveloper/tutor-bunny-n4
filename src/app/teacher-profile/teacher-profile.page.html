<ion-header>
  <app-sd-header-top [title]="'Teacher Profile'" [backUrl]="'tabs/teacher-dashboard'" [showBack]="true"></app-sd-header-top>
</ion-header>

<ion-content class="ion-padding ion-content-medium-background">

  <div class="body-content-68448">
    <!-- <app-profile-box></app-profile-box> -->
    <div class="profile-box-98875">
      <div class="item-box-98875">
        <div class="image-box-98875" (click)="openEditProfile()">
          <!-- <img class="image-box-image-7-98875" src="assets/role-base-8-images/image4.jpeg" /> -->
          <div class="image-box-89657" [style.background-image]="'url(' + image + ')'"  >
          </div>
          <div class="edit-icon-box-98875">
            <img class="image-box-image-8-98875" src="assets/svg/edit-lr.svg" />
          </div>
        </div>
        <div class="title-box-98875">
          <div class="heading-box-98875">
            <div class="heading-box-line-98875">
              <span class="fs-21 outfit-medium">{{item?.name}}</span>
              <img *ngIf="shield == true" src="assets/svg/verified-profile-sheild.svg" />
            </div>
            <!-- <div class="create-course-btn-98875 fs-16 outfit-medium">Create Course</div> -->
          </div>
          <div class="flag-box-98875">
            <span slot="start" class="fi fi-{{getFlag()}}"></span>
            <div class="fs-16 outfit">{{data?.country?.name}}</div>
          </div>
        </div>

      </div>

    </div>

    <app-teacher-profile-statistics></app-teacher-profile-statistics>
    <div class="fs-16 outfit">
      {{data?.title}}
    </div>
    <div class="fs-16 outfit">
      <div class="fs-16 outfit-semibold">Description</div>
      {{data?.description}}
    </div>
  </div>



</ion-content>
