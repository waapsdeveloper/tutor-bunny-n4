<ion-header>
  <div class="top-header-78956">
    <div class="header-left-items-78956">
      <div class="header-title  roboto-regular ">Select Age</div>
    </div>
    <div class="header-right-items-78956" (click)="back()">
      <img class="image" src="../../assets/svg/cancel.svg" style="height: 24px;" alt="">
    </div>
  </div>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let item of list" (click)="selection(item)">
      <div class="fs-16 roboto-regular">{{ item.name}}</div>
    </ion-item>
  </ion-list>

</ion-content>
