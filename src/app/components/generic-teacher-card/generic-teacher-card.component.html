<div class="nd-card-outer-748">
  <div
    class="image-outer" [class.rectangle-image-outer]="hostScreensize <400" (click)="openDetails.emit()"
    [ngStyle]="{ 'background-image': 'url(' + item.image + ')' }"
>
    <div class="label-bar-bottom" *ngIf="hostScreensize>400">
      <span>{{ item.teacher.auth_user_currency_symbol }} {{ item.teacher.hourly_rate }}</span>
    </div>
  </div>
  <div class="content-outer" [class.rectangle-content-outer]="hostScreensize <400">
    <div class="content-inner">

      <div class="content-title roboto-medium fs-16" (click)="openDetails.emit()">
        {{ item?.teacher?.experience_description }}
      </div>


      <div class="other-info">
        <div class="rating">
          <app-rating-stars [rating]="rating"></app-rating-stars>
          <span class="rating-value fs-12 roboto-medium"
            >{{ rating }} ({{ total_rating }})</span
          >
        </div>

        <div class="teacher">
          <img
            class="teacher-image"
            [src]="teacherImage"
            alt="Teacher"
          />
          <div class="teacher-name roboto-regular fs-14">{{displayName}}</div>
          <span slot="start" class="fi fi-{{flag}}"></span>
        </div>

        <div class="actions">
          <div class="big-action-button-8574" [class.less-screen-width-style]="hostScreensize <= 400"(click)="goToChat(item)">
            <img src="assets/svg/send-message.svg" alt="" height="16px"/>
            <span class="message-text">Message</span>
          </div>

          <div class="action-items">
            <img src="assets/svg/bookmark.svg" />
            <!-- <ion-icon
              [name]="item.is_liked_by_me ? 'heart' : 'heart-outline'"
              (click)="item.is_liked_by_me ? removeToFav() : addToFav()"
            >
            </ion-icon> -->
            <img src="assets/svg/share-77.svg" alt="Share" class="share-icon" />
          </div>
        </div>

      </div>




    </div>
  </div>
</div>
