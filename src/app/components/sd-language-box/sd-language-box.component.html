<div class="sd-input-box-outer-675315 ion-activatable ripple-parent rectangle" (click)="openLanguageSelection()">
  <ion-ripple-effect></ion-ripple-effect>
  <input class="fs-16 outfit sd-input-box-input-675315" [type]="type" [placeholder]="placeholder" readonly />
  <ion-icon name="chevron-down-outline"></ion-icon>
</div>
<div class="language-chips">
  <div class="lang-chips lang-chips-7895545" *ngFor="let item of language">
    <ion-chip class="chips-type-sm-7895 fs-14 outfit">{{item.name}} <ion-icon name="close-circle-outline"
        (click)="removeLanguage(item)"></ion-icon></ion-chip>
  </div>
</div>
<app-sd-error-input-info *ngIf="isRequired" [errorText]="errorText"></app-sd-error-input-info>
