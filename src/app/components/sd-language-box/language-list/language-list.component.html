

<ion-header>
  <app-sd-header-top [showBack]="false" [title]="'Subjects'"></app-sd-header-top>
  <ion-searchbar class="fs-16 outfit"></ion-searchbar>
</ion-header>


<ion-content>
  <ion-list>
    <ion-item *ngFor="let item of list" >
      <ion-label>
        <h2 class="fs-16 outfit">{{item.name}}</h2>
      </ion-label>
      <ion-checkbox slot="start" [(ngModel)]="item.checked"></ion-checkbox>
    </ion-item>
  </ion-list>
  <ion-infinite-scroll (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
<ion-footer class="ion-padding">
  <app-sd-button-gray [text]="'Save'" (click)="selectedLanguage()"></app-sd-button-gray>
</ion-footer>
