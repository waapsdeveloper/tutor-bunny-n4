<div class="trial-box-outer-689567">
  <div class="sb-heading-7895">
    <div class="sb-heading-title-7895 outfit-semibold">My Dashboard</div>
  </div>
  <div class="sb-content-7895"></div>
</div>
<ion-grid class="dashboard-stats-outer">
  <ion-row class="dashboard-cards-top-outer">
    <!-- Earnings Card -->
    <ion-col>
      <div class="card-34567">
        <div class="dimg">
          <img src="../../../assets/svg/dashboard-icon.svg" alt="dashboard" />
        </div>
        <div class="txt">₹ 51,858</div>
        <span class="earn">Earnings Till Date</span>
        <div class="arrow-btn">
          <img src="../../../assets/svg/tarrow.svg" alt="Arrow Button" />
        </div>
      </div>
    </ion-col>

    <ion-col>
      <div class="card-34567">
        <div class="dimg">
          <img src="../../../assets/svg/coin.svg" alt="coin" />
        </div>
        <div class="txt">32</div>
        <span class="earn">Credit Balance</span>
        <div class="arrow-btn">
          <img src="../../../assets/svg/tarrow.svg" alt="Arrow Button" />
        </div>
      </div>
    </ion-col>
    <!-- Credit Balance Card -->

  </ion-row>

  <div class="icon-box">
    <!-- Icon 1: New Trial Requests -->
    <div class="icon-item">
      <div class="icon">
        <img src="../../../assets/svg/new-trial.svg" alt="New Trial" />
      </div>

      <div class="icon-info">
        <div class="icon-number">{{trials}}</div>
        <span class="icon-label">New Trial <br> Requests</span>
      </div>
    </div>

    <div class="vl"></div>
    <!-- Icon 2: Message Requests -->
    <div class="icon-item">
      <div class="icon">
        <img src="../../../assets/svg/message.svg" alt="Message" />
      </div>
      <div class="icon-info">
        <div class="icon-number">2</div>

        <span class="icon-label">Message <br>Requests</span>
      </div>
    </div>

    <div class="vl"></div>
    <!-- Icon 3: Trials in Progress -->
    <div class="icon-item">
      <div class="icon">
        <img src="../../../assets/svg/in-progress.svg" alt="In Progress" />
      </div>
      <div class="icon-info">
        <div class="icon-number">3</div>
        <span class="icon-label">Trials <br>In Progress</span>
      </div>
    </div>
    <div class="vl"></div>

    <!-- Icon 4: Trials Completed -->
    <div class="icon-item">
      <div class="icon">
        <img src="../../../assets/svg/trial-completed.svg" alt="Completed" />
      </div>
      <div class="icon-info">
        <div class="icon-number">16</div>
        <span class="icon-label">Trials<br> Completed</span>
      </div>
    </div>
  </div>
</ion-grid>
