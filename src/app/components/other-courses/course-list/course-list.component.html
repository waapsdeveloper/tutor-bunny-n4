<div class="vedio-content-89658">
  <swiper [slidesPerView]="2" [spaceBetween]="10" [pagination]="{ clickable: true }" class="swiper-container-7895">
    <ng-template swiperSlide *ngFor="let item of list" (click)="oepnLink(item)">
      <div class="vedio-box-inner card" (click)="oepnLink(item)">
        <div class="video-89654"
          [style.background-image]="item.image ? 'url(' + item.image + ')' : 'assets/learn-piano.jpeg'"></div>
        <div class="video-para">{{item.title}}</div>
        <div class="price-tag">{{item.auth_user_currency_symbol}} {{item.price}} /month</div>
      </div>
    </ng-template>
  </swiper>
</div>
