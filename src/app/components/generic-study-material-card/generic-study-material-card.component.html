<div class="nd-card-outer-748">
  <div
    class="image-outer" (click)="openDetails.emit()"
    [ngStyle]="{ 'background-image': 'url(' + item.image + ')' }"
  >
    <div class="label-bar-bottom">
      <span>{{ item.auth_user_currency_symbol }} {{ item.updated_price }}</span>
    </div>
  </div>
  <div class="content-outer">
    <div class="content-inner">

      <div class="content-title roboto-medium fs-16" (click)="openDetails.emit()">
        {{ item.title }}
      </div>


      <div class="other-info">
        <div class="rating">
          <app-rating-stars [rating]="rating"></app-rating-stars>
          <span class="rating-value fs-12 roboto-medium"
            >{{ rating }} ({{ total_rating }})</span
          >
        </div>

        <div class="teacher">
          <img
            class="teacher-image"
            [src]="teacherImage"
            alt="Teacher"
          />
          <div class="teacher-name roboto-regular fs-14">{{displayName}}</div>
          <span slot="start" class="fi fi-{{flag}}"></span>
        </div>

        <div class="actions">
          <div class="big-action-button-8574" (click)="toggleCartItem()">
            <img src="assets/svg/cart.svg" alt="" /> {{ itemExistInCart$ > 0 ? 'In Cart' : 'Add to Cart' }}
          </div>

          <div class="action-items">
            <img [src]="itemExistInFav$ ? 'assets/svg/heart-78.svg' : 'assets/svg/heart-77.svg'"
              (click)="itemExistInFav$ ? removeToFav() : addToFav()" /><!-- <ion-icon
              [name]="item.is_liked_by_me ? 'heart' : 'heart-outline'"
              (click)="item.is_liked_by_me ? removeToFav() : addToFav()"
            >
            </ion-icon> -->
            <img src="assets/svg/share-77.svg" alt="Share" class="share-icon" />
          </div>
        </div>

      </div>




    </div>
  </div>
</div>
