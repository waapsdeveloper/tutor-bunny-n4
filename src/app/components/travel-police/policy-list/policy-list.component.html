<ion-header>
  <app-sd-header-top [showBack]="false" [title]="'Category'"></app-sd-header-top>
</ion-header>

<ion-content>
  <ion-list>
    <ion-radio-group [(ngModel)]="selectedItemId" (ngModelChange)="selectedCategory()">
      <ion-item *ngFor="let item of list">
        <ion-label>{{ item.name }}</ion-label>
        <ion-radio slot="start" class="fs-16 outfit" [value]="item.id"></ion-radio>
      </ion-item>
    </ion-radio-group>
  </ion-list>

</ion-content>
