
<ion-header>
  <app-sd-header-top [showBack]="false" [title]="'Subjects'"></app-sd-header-top>
  <ion-searchbar class="fs-16 outfit"></ion-searchbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let item of list" (click)="selection(item)">
      <ion-label>
        <h2 class="fs-16 outfit-medium">{{item.name}} </h2>
        <!-- <p class="fs-16 outfit">{{item.phonecode}}</p> -->
      </ion-label>
    </ion-item>
  </ion-list>
  <ion-infinite-scroll (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
