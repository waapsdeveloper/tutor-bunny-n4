<div class="trial-box-outer-689567">
  <div class="trial-box-inner-689567">
    <div class="trial-box-heading-outer">
      <div class="trial-box-heading-outer-title">
        <img src="assets/svg/trial-icon.svg" style="height: 16px" />
        <div class="trial-box-heading-7895 roboto-medium fs-16">
          Trial Request
        </div>
      </div>
      <div class="trial-box-heading-outer-sl-7895">
        <img src="assets/svg/bookmark.svg" style="height: 20px" />
        <div class="trial-box-heading-accept-2156 roboto-medium fs-12">
         <span>Accept</span>
        </div>
        <div class="trial-box-heading-reject-2156 roboto-medium fs-12">
          <span>Reject</span>
        </div>
      </div>
    </div>
    <div class="trial-box-content-outer">
      <div
        class="image-container-23432"
        [style.background-image]="
          item?.student.image
            ? 'url(' + item?.student.image + ')'
            : 'assets/profileimg.png'
        "
      ></div>
      <div class="content-container-23432">
        <div class="profile-name-outer-8973 roboto-medium fs-16">
          {{ displayName | names }}
        </div>
        <div class="profile-age-2154">
          <img src="assets/svg/cake.svg" alt="Age Icon" class="icon" />
          <span class="roboto-regular fs-14">Age 6</span>
        </div>
        <div class="profile-location-31543">
          <img
            src="../../../../assets/svg/Flag1.svg"
            class="flag"
            alt="Country Flag"
          />

          <span class="country-name roboto-regular fs-16">United States</span>
        </div>
      </div>
    </div>
  </div>
</div>
