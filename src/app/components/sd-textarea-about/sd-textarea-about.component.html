<div class="sd-input-box-outer-675315">
  <textarea class="fs-16 outfit sd-input-box-input-675315" rows="10" [placeholder]="placeholder"  [minlength]="minlength" [maxlength]="maxlength" [(ngModel)]="inputText" (keyup)="result($event)"></textarea>
  <ion-icon *ngIf="inputText" name="close-outline" (click)="clearInput()"></ion-icon>
</div>
<app-sd-error-input-info *ngIf="isRequired && needed" [errorText]="errorText" ></app-sd-error-input-info>
