<div class="image-upload-box-st-78955674">
  <div class="icno-text-88666">
    <div class="image-box-89657" *ngIf="samplecertificateImage !== '/assets/gallary.png'"
    [ngStyle]="{ 'background-image': samplecertificateImage !== '/assets/gallary.png'  ? 'url(' + samplecertificateImage + ')' : 'none' }"></div>
