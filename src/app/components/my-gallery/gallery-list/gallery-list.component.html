<swiper [slidesPerView]="2.5" [spaceBetween]="10" [pagination]="{ clickable: true }"
  class="swiper-container-inner-7892" #slides>
    <ng-template swiperSlide *ngFor="let image of list">
      <div class="vedio-box-inner" [style.backgroundImage]="setBackgroundImage(image)" (click)="openImage(image.image)"></div>
    </ng-template>
  </swiper>
