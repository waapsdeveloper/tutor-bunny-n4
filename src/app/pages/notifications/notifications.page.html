<ion-header class="ion-no-border ion-no-shadow">
  <app-sd-header-top [showBack]="true" [title]="'Notifications'"></app-sd-header-top>
</ion-header>
<ion-content>

  <app-notification-box *ngFor="let item of notificationService.list; let i = index" [item]="item" [index]="i"
    (reloadList)="reloadLIst($event)" (collectIds)="collectIds($event)"></app-notification-box>
  <div style="height: 700px; display: flex; align-items: center; justify-content: center" class="ion-padding"
    *ngIf="notificationService.list.length == 0">No notification to display</div>
  <ion-infinite-scroll (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
