<ion-content class="">
  <div class="body-content ion-padding">
    <div class="search-box-outer-89655" *ngIf="isSearchBarShow">
      <div class="search-box-input-outer">
        <img src="assets/icon/input-search-gray.svg" />
        <input
          type="text"
          placeholder="Search Course"
          [(ngModel)]="search"
          (keyup.enter)="doSearch($event)"
        />
      </div>
    </div>
    <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
      <ion-refresher-content></ion-refresher-content>
    </ion-refresher>
    <app-course-card
      *ngFor="let item of list"
      [item]="item"
      (courseDeleted)="onCourseDeleted($event)"
      (activeTab)="courseActive()"
      (inActiveTab)="courseInctive()"
      (detailsAction)="openDetails($event)"
      (courseEdit)="courseEdit()"
    >
    </app-course-card>
    <div style="height: 100%; position: relative">
      <div class="centered-message" *ngIf="list.length == 0">
        No course to display
      </div>
    </div>
    <ion-infinite-scroll (ionInfinite)="onIonInfinite($event)">
      <ion-infinite-scroll-content></ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </div>
</ion-content>
