<ion-header class="ion-no-border ion-no-shadow">
  <app-sd-header-top [title]="'Course Photos'" [backUrl]="" [showBack]="true"></app-sd-header-top>
</ion-header>

<ion-content class="ion-padding ion-content-medium-background">

  <div class="gallery-outer-8965">

    <div class="image-card-78975" *ngFor="let coursePhoto of createCourseService.coursePhotos" [style.backgroundImage]="setBackgroundImage(coursePhoto)"

      (click)="openImage(coursePhoto)">

      <img src="assets/svg/delete.svg" class="clear-input-678956744" (click)="clearImage(coursePhoto.id, $event)">
    </div>
  </div>
  <input type="file" (change)="onFileSelected($event)" accept="image/*" style="display: none" #photoInput multiple />
</ion-content>

<ion-footer class="ion-padding ion-no-border ion-no-shadow ion-content-medium-background" >

  <div class="d-flex flex-column gap-16" style="width: 100%;">
    <app-sd-button-gray style="width: 100%;" (click)="photoInput.click()" [image]="'assets/svg/upload.svg'"
      [text]="'Upload course photos'"></app-sd-button-gray>
    <app-sd-button-gray style="width: 100%;" (click)="backToProfile()" [image]="'assets/svg/done.svg'"
      [text]="'Done'"></app-sd-button-gray>
  </div>
</ion-footer>
