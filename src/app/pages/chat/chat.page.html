<ion-header class="ion-no-border ion-no-shadow">
  <!-- (toggleSearchBar)="ShowSearchBar($event)" -->
  <app-sd-header-top
    [showBack]="false"
    [title]="'Chat'"
    [backUrl]=""
    [showNotification]="false"
    [showSearch]="false"
  ></app-sd-header-top>
</ion-header>
<div class="dashboard-top-fixed-98563 ">
  <div class="header-chips">
    <div class="header-chip">
      <div class="ion-chip" [class.active-class]="view === 'inbox'" [class.inactive-class]="view !== 'inbox'"
        (click)="toogleView('inbox')"><img src="assets/inbox.svg" alt="">Inbox</div>
      <div class="ion-chip" [class.active-class]="view === 'requests'" [class.inactive-class]="view !== 'requests'"
        (click)="toogleView('requests')"><img src="assets/request.svg" alt="">Message Requests</div>
    </div>
  </div>
</div>

<ion-content [scrollY]="false">

  <swiper [slidesPerView]="1" [spaceBetween]="10" [pagination]="{ clickable: true }" class="swiper-container-inner-78967852" #slides (transitionEnd)="onSlideChanged()">
    <ng-template swiperSlide>
      <app-global-list-view
          [list]="list$"
          [itemTemplate]="itemTemplate"
          (refresh)="handleRefresh($event)"
          (loadMore)="onIonInfinite($event)"
        >
          <ng-template #itemTemplate let-item>
            <app-chat-list [item]="item"></app-chat-list>
          </ng-template>
        </app-global-list-view>
    </ng-template>
    <ng-template swiperSlide>
      <app-global-list-view
          [list]="requestList$"
          [itemTemplate]="itemTemplate"
          (refresh)="handleRefresh($event)"
          (loadMore)="onIonInfinite($event)"
        >
          <ng-template #itemTemplate let-item>
            <app-request-list [item]="item"></app-request-list>
          </ng-template>
        </app-global-list-view>
    </ng-template>

  </swiper>


</ion-content>
