<div [class.chat-right-box]="user_id != chat.user_id" [class.chat-left-box]="user_id == chat.user_id">
  <div [class.chat-recive-85622]="user_id != chat.user_id" [class.chat-send-85625]="user_id == chat.user_id">
    <div [class.chat-recive-text-85623]="user_id != chat.user_id"
      [class.chat-send-text-85626]="user_id == chat.user_id">{{chat.message}}
    </div>
    <div class="chat-recive-time-85624">{{getTime(chat.created_at)}}</div>
  </div>
</div>
