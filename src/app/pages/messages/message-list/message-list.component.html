<div [class.chat-right-box]="user_id != chat.user_id" [class.chat-left-box]="user_id == chat.user_id">
  <div [class.chat-recive-85622]="user_id != chat.user_id" class="outfit-light fs-16" [class.chat-send-85625]="user_id == chat.user_id">
    <div [class.chat-recive-text-85623]="user_id != chat.user_id"
      [class.chat-send-text-85626]="user_id == chat.user_id">
      <div [innerHTML]="message"></div>
      <div class="chat-recive-time-85624">{{getTime(chat.created_at)}} <img src="assets/svg/sentMessage.svg" alt=""> </div>
    </div>
  </div>
</div>
