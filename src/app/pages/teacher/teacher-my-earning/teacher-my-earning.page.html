<ion-header class="ion-no-border ion-no-shadow">
  <app-sd-header-top
    [title]="'My Earnings'"
    [showBack]="true"
    [parentHandleBack]="true"
    (parentBack)="goback()"
    [backUrl]=""
  ></app-sd-header-top>
</ion-header>

<ion-content>
  <div class="earnings-container">
    <div class="tabs">
      <div
        *ngFor="let chip of chips; let i = index"
        class="chips outfit-light fs-16"
        [class.active]="selectedChip === i"
        (click)="selectChip(i)"
      >
        {{ chip }}
      </div>
    </div>

    <div class="total-payment">
      <p class="roboto-regular fs-16">Total Payment</p>
      <span class="roboto-bold fs-16">$51,858</span>
    </div>

    <ion-list>
      <ion-item lines="full" *ngFor="let month of months">
        <ion-label class="roboto-regular fs-16 months">{{ month }}</ion-label>
        <ion-text class="roboto-regular fs-16" style="color: #000000"
          >$317.91</ion-text
        >
        <ion-icon name="chevron-forward-outline" style="color: #454545"></ion-icon>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
