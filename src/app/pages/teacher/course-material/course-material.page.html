<ion-header class="ion-no-border ion-no-shadow">
  <app-sd-header-top
    [title]="'My Offerings'"
    [showBack]="true"
    [parentHandleBack]="true"
    (parentBack)="goback()"
    [backUrl]=""
  ></app-sd-header-top>
</ion-header>
<!-- 
<div class="dashboard-top-fixed-98563">
  
</div> -->
<div class="header-chips">
  <div class="header-chip">
    <div
      class="ion-chip"
      [class.active-class]="view === 'course'"
      [class.inactive-class]="view !== 'course'"
      (click)="toogleView('course')"
    >
      <img src="assets/icon/home/my-corces.svg" alt="" />Courses
    </div>
    <div
      class="ion-chip"
      [class.active-class]="view === 'notes'"
      [class.inactive-class]="view !== 'notes'"
      (click)="toogleView('notes')"
    >
      <img src="assets/svg/studey-notes.svg" alt="" />Study Notes
    </div>
  </div>
</div>
<ion-content>
  <!-- <ion-router-outlet></ion-router-outlet> -->

  <!-- <ion-router-outlet></ion-router-outlet> -->
  
  <swiper [slidesPerView]="1" [spaceBetween]="10" [pagination]="{ clickable: true }" class="swiper-container-inner-78967852" #slides (transitionEnd)="onSlideChanged()">
    <ng-template swiperSlide>
      <app-courses style="height: 100%; width: 100%;"></app-courses>
    </ng-template>
    <ng-template swiperSlide>
      <app-notes style="height: 100%; width: 100%;"></app-notes>
    </ng-template>    
  </swiper>






</ion-content>
