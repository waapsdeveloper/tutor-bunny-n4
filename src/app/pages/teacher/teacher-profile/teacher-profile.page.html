<ion-content>
  <app-stp-page-header
    [data]="headerData"
    (back)="nav.pop()"
  ></app-stp-page-header>
  <app-stp-page-video-box [data]="videoBox"></app-stp-page-video-box>

  <div class="body-content-684488">
    <app-stp-page-info [data]="infoData"></app-stp-page-info>

    <app-stp-page-profile-statistics
      [data]="countData"
    ></app-stp-page-profile-statistics>
    <app-global-text-read
      [heading]="aboutData.heading"
      [text]="aboutData.text"
    ></app-global-text-read>

    <!-- courses section -->
    <app-my-courses *ngIf="courseData.list.length !== 0"
      [data]="courseData"
      (clickOpen)="clickOpenCourse($event)"
    ></app-my-courses>
    <app-my-gallery [data]="galleryData" *ngIf="galleryData.list.length !== 0"></app-my-gallery>

    <app-my-ratings [data]="ratingData" *ngIf="ratingData.list.length !== 0"></app-my-ratings>
  </div>
</ion-content>
<ion-footer></ion-footer>
