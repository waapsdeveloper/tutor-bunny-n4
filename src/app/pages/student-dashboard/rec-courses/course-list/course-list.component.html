<div class="courses-block-outer-789565" *ngIf="blocked != 'Blocked'">
  <div class="courses-block-item-789565">
    <div class="block-item-header" (click)="goToDeatil(item)">
      <div class="block-item-header-title outfit-medium"> {{item?.title}}</div>
      <img src="../../../../assets/svg/left-arrow.svg" alt="">
    </div>
    <div class="block-item-body">
      <div class="profile-item-block">
        <div>
          <div class="profile-item-image-block" (click)="goToDeatil(item)"
            [style.background-image]="item.image ? 'url(' + item.image + ')' : 'assets/learn-piano.jpeg'">
          </div>
        </div>
        <div class="profile-content-78678564">
          <div class="profile-line-789575">
            <div style="display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;">
              <div class="info-misc-68448 outfit ">
                <app-rating-stars [rating]="rating"></app-rating-stars>
                {{rating}} ({{total_rating}})
              </div>
            </div>
          </div>
          <div class="profile-above-footer-986985">
            <div class="us-status-btn">
              <div class="us-status-btn-label outfit-medium">
                <!-- <img src="../../../../assets/svg/p-tag.svg" alt=""> -->
                {{item.auth_user_currency_symbol}} {{item.updated_price}} <span style="font-size: 12px;">/lesson</span>
              </div>
            </div>
          </div>
          <div class="group-96589">
            <div class="techer-img-98523"
              [style.background-image]=" item.user.image ? 'url(' + item.user.image + ')' : 'assets/learn-piano.jpeg'">
            </div>
            <div class="label-789575 fs-16 outfit-medium">{{displayName}}</div>
            <span *ngIf="flag" slot="start" class="fi fi-{{flag}}"></span>
            <div>{{this.item.user.teacher.country.name}}</div>
          </div>
        </div>
        <ion-icon style="  position: absolute; right: -2px;"
          [name]="item.is_liked_by_me === true ? 'heart' : 'heart-outline'"
          (click)="item.is_liked_by_me === true ? removeToFav() : addToFav()"
          [class]="item.is_liked_by_me === true ? 'loved-icon' : 'loved-icon2'"></ion-icon>

      </div>
      <div class="profile-below-footer-986985">
        <div class="ble-buttons-789576856">
          <img src="../../../assets/svg/share.svg" />
          <div class="outfit fs-16">Share</div>
        </div>
        <div style="display: flex; align-items: center; justify-content: center;gap: 8px;" (click)="goToChat(item)">
          <img src="../../../../assets/svg/chat-dark.svg" alt="">
          <div>Chat</div>
        </div>
        <!-- <div class="buy-now-btn-89675 outfit-medium">Subscribe</div> -->
        <div class="free-trial-btn-89675 outfit-medium"
          *ngIf="trail == false && loading == false && status != 'Rejected' " (click)="requestTrail(item.id)">
          <img src="../../../../assets/svg/transfer.svg" alt="">Free Trial
        </div>
        <div class="free-trial-btn-89675 outfit-medium" *ngIf="status == 'Rejected' && loading == false "
          (click)="requestTrail(item.id)">
          <img src="../../../../assets/svg/transfer.svg" alt="">Free Trial
        </div>

        <div id="present-alert" class="free-trial-btn-89676 outfit-medium"
          *ngIf="trail == true && loading == false && status != 'Accepted' && status != 'Rejected'&& status != 'Complete'"
          (click)="presentAlert()">
          <img src="../../../../assets/svg/trail.svg" alt=""><button
            style="background-color: transparent; color:#000000 ; font-size:16px;">Cancel trial</button>
        </div>
        <div id="present-alert" class="free-trial-btn-89676 outfit-medium"
          *ngIf="trail == true && loading == false && status == 'Accepted'">
          <button style="background-color: transparent; color:#000000 ; font-size:16px;">Trial Accepted</button>
        </div>
        <div id="present-alert" class="free-trial-btn-89676 outfit-medium"
          *ngIf="trail == true && loading == false && status == 'Complete'">
          <img src="../../../../assets/svg/complete.svg" alt="">Trial Completed
        </div>
        <ion-spinner name="dots" *ngIf="loading"></ion-spinner>
      </div>
    </div>
  </div>
</div>
