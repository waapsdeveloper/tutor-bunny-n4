<div *ngIf="spinner" class="loading-syn ">
  <ion-spinner></ion-spinner>
</div>

<ion-header [class.tabs-opacity-0]="spinner" [class.tabs-opacity-1]="!spinner" class="ion-no-border ion-no-shadow">
  <app-sd-header-top [showBack]="true" [title]="'Study Material Details'" [showShare]="true" [showFav]="true"
    [showFavValue]="showFavValue" (addToFav)="addToFav()" (removetoFav)="removeToFav()"></app-sd-header-top>
</ion-header>

<ion-content [class.tabs-opacity-0]="spinner" [class.tabs-opacity-1]="!spinner" [fullscreen]="true"
  style="--padding-top: 0px !important" #content>
  <app-course-photos [course_Id]="course_Id"></app-course-photos>

  <div class="body-content ion-padding">

    <div class="course-heading-78521">
      {{title}}
    </div>
    <div class="cource-price-and-rating-box-78541">
      <div class="cource-price--78542">{{currencySymbol}}{{price}} <span style="font-size: 12px;"> /lesson</span></div>
      <div class="cource-rating-box-78543">
        <app-rating-stars [rating]="rating"></app-rating-stars>
        <div class="cource-rating-number-78545">{{rating}} <span
            style="font-size: 12px; color: #7C7B7B;">({{total_rating}})</span></div>
      </div>
    </div>
    <div class="line"></div>

    <div class="detail-box-outer-78522">
      <div class="detail-head-78523">
        <div class="detail-heading-78524">Details</div>
        <div class="detail-heading-left--78524" *ngIf="startDate && endDate"
          style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; color: #7A7A7A;">
          <img src="../../assets/svg/calander.svg" alt="" style="height: 16px;">{{startDate}} to {{endDate}}
        </div>
      </div>
      <div class="fs-16 outfit discription-text">
        <div class="discription-para" [class.collapsed]="isExpanded" [innerHTML]="description">
        </div>
        <div class="qulification-box-edu-readmore-98525" *ngIf="!isExpanded">
          <div class="qulification-box-edu-button-98526" (click)="toggleReadMore()">Read More</div>
        </div>
        <div class="education-box-edu-readmore-98525" *ngIf="isExpanded">
          <div class="education-box-edu-button-98526" (click)="toggleReadMore()">Read less</div>
        </div>
      </div>
    </div>
    <div class="line"></div>
    <!-- Attachments Section -->
    <div class="attachments-section">
      <div class="attachment-header">
        <div class="attachment-title">Attachments (5)</div>
        <div class="download-link">
          <img src="../../assets/svg/download.svg" alt="download" class="download-icon" />
          <span>Download</span>
        </div>
      </div>
      <div class="attachment-files">
        <div class="doc"><img src="../../assets/svg/doc.svg" alt="doc"></div>
        <div class="doc"><img src="../../assets/svg/doc.svg" alt="doc"></div>
        <div class="doc"><img src="../../assets/svg/doc.svg" alt="doc"></div>
        <div class="doc"><img src="../../assets/svg/doc.svg" alt="doc"></div>
      </div>
    </div>
    <div class="line"></div>
    <div class="detail-box-outer-78522">
      <div class="detail-head-785234">
        <div class="detail-heading-78524 outfit-medium">Created By</div>
        <div class="instructor-box-content-78561">
          <div class="instructor-head-78562">
            <div class="instructor-image-78563" (click)="goToTeacher()"
              [style.background-image]="techerImg ? 'url(' + techerImg + ')' : 'assets/learn-piano.jpeg'"></div>
            <div class="instructor-info-78564" (click)="goToTeacher()">
              <div class="instructor-name-78565">{{displayName}}</div>
              <div class="instructor-country-78567">
                <span *ngIf="flag" slot="start" class="fi fi-{{flag}}"></span> {{country}}
              </div>
            </div>
            <img (click)="goToTeacher()" src="../../assets/svg/arrow-right.svg" class="arrow-icon" alt="">
          </div>
          <div class="instructor-title-78568">{{techerTitle}}</div>
        </div>
      </div>
    </div>




  </div>
  <div class="line" *ngIf="schedules.length !== 0"></div>
  <!-- <div class="line" *ngIf="schedules.length !== 0"></div> -->
  <app-student-other-study-material (onChange)="getOtherCourse($event)"
    [teacher]="teacher"></app-student-other-study-material>

</ion-content>
<ion-footer [class.tabs-opacity-0]="spinner" [class.tabs-opacity-1]="!spinner">
  <div class="footer-buttons-78963">
    <div class="button-chat-78563" *ngIf="!data?.trial && !btn_loading">
      <div class="sd-clear-btn-967895 ion-activatable ripple-parent rectangle" (click)="goToChat()">
        <ion-ripple-effect></ion-ripple-effect>
        <img src="assets/svg/chat.svg" />
        <span class="roboto-regular fs-16 " style="color: #484848; ">Chat</span>
      </div>
    </div>
    <div class="button-chat-7856" *ngIf="data?.trial && data.trial.status === 'Accepted' && !btn_loading">
      <div class="sd-clear-btn-967895 ion-activatable ripple-parent rectangle" (click)="goToChat()">
        <ion-ripple-effect></ion-ripple-effect>
        <img src="assets/svg/chat.svg" />
        <span class="roboto-regular fs-16 " style="color: #484848; ">Chat</span>
      </div>
    </div>
    <div class="button-chat-7856" *ngIf="data?.trial && data.trial.status === 'Complete' && !btn_loading">
      <div class="sd-clear-btn-967895 ion-activatable ripple-parent rectangle" (click)="goToChat()">
        <ion-ripple-effect></ion-ripple-effect>
        <img src="assets/svg/chat.svg" />
        <span class="roboto-regular fs-16 " style="color: #484848;">Chat</span>
      </div>
    </div>
    <div class="button-trial-23654" *ngIf="!data?.trial && type !== 3 && !btn_loading">
      <div class="sd-clear-btn-967896 ion-activatable ripple-parent rectangle" (click)="requestTrail()">
        <ion-ripple-effect></ion-ripple-effect>
        <img src="assets/svg/send.svg" />
        <span class="roboto-regular fs-16 "> Request Free Trial </span>
      </div>
      <ion-spinner name="dots" *ngIf="loading"></ion-spinner>
    </div>
    <div class="button-trial-23654" *ngIf="!data?.trial && type === 3 && !btn_loading">
      <div class="sd-clear-btn-967896 ion-activatable ripple-parent rectangle" (click)="requestTrail()">
        <ion-ripple-effect></ion-ripple-effect>
        <img src="assets/svg/send.svg" />
        <span class="roboto-regular fs-16 ">Join </span>
      </div>
      <!-- <ion-spinner name="dots" *ngIf="loading"></ion-spinner> -->
    </div>
    <div style="width: 100%;" *ngIf="data?.trial && data.trial.status === 'Pending' && !btn_loading">
      <app-sd-button-clear [image]="'assets/svg/trail.svg'" (click)="presentAlert()"
        [text]="'Cancel Trial Request'"></app-sd-button-clear>
    </div>
    <div style="width: 100%;" *ngIf="btn_loading">
      <ion-skeleton-text animated style="width: 100%; height: 57px; border-radius: 8px;"></ion-skeleton-text>
    </div>
  </div>
</ion-footer>
