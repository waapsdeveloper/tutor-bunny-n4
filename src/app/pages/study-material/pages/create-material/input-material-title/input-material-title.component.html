<div class="input-box-lines d-flex flex-column gap-8">
  <div class="input-title fs-14 roboto-medium label-with-word-count">
    <div class="label-with-word-count-left">
      <span>Title</span> <img src="../../assets/svg/question.svg" alt="" id="click-trigger">
    </div>
    <div class="label-with-word-count-right roboto-light"> {{ title.length || 0 }} / 50 </div>
  </div>
  <ion-popover trigger="click-trigger" triggerAction="click">
    <ng-template style="width: 100%;">
      <div class="ion-padding popover-title">Add the keywords in the title, user can find the course/
        workshop/ event
        easily.!
      </div>
    </ng-template>
  </ion-popover>
  <app-sd-input-box placeholder="Material title (Maximum 50 characters)" (onChange)="result($event, 'title')"
    [inputText]="title" [key]="'title'" [errorText]="'title is required'"
    [maxlength]="50"></app-sd-input-box>
</div>
