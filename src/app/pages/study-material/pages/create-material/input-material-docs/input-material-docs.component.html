<div class="input-box-lines d-flex flex-column gap-8">
  <div class="input-title fs-14 roboto-medium">Upload study materials/ notes/ Lectures<img src="../../assets/svg/question.svg" alt="" style="height: 16px; width: 16px; padding-left: 1px;"
    id="click-doc"></div>
    <ion-popover trigger="click-doc" triggerAction="click">
      <ng-template>
        <div class="ion-padding popover-title">Upload the document of the course</div>
      </ng-template>
    </ion-popover>
  <div class="image-upload-box-st-78955674" >
    <div class="icno-text-88666" >
      <div *ngIf="doc$" class="image-box-78559" [style.backgroundImage]="setBackgroundImage(doc$)" ></div>
      <div *ngIf="doc$" class="roboto-regular fs-14">{{ docsLength }} items have been uploaded</div>

      <img *ngIf="!doc$" src="assets/svg/material-photo.svg" alt="Selected Image" class="img-67855" />
      <div *ngIf="!doc$" class="roboto-regular fs-14">Upload study materials</div>

    </div>

    <ion-icon name="chevron-forward-outline"></ion-icon>
  </div>
  <div class="input-title fs-12 roboto-regular">Supported file types: PDF, DOC, XL, JPEG, PNG, BMP, TXT</div>

</div>
<app-sd-error-input-info  *ngIf="isRequired && needed" [errorText]="errorText"></app-sd-error-input-info>
