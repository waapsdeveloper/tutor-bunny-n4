<div class="subject-sec d-flex flex-column gap-8">
  <div class="input-title fs-14 roboto-medium">Search Keyword <img src="../../assets/svg/question.svg" alt=""
      id="click-keyword "></div>
  <ion-popover trigger="click-keyword " triggerAction="click">
    <ng-template>
      <div class="ion-padding popover-title">Add multiple search keywords so that the course will come up in
        the search result.
      </div>
    </ng-template>
  </ion-popover>
  <div class="input-box-lines" style="width: 100%;">
    <app-material-search-keyword
      placeholder="Type and add"></app-material-search-keyword>
  </div>
</div>
<app-sd-error-input-info *ngIf="isRequired" [errorText]="errorText"></app-sd-error-input-info>
