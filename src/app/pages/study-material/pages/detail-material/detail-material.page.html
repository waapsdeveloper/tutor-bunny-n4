<ion-content class="remove-pd-top-323243243" #content [fullscreen]="true">

  <app-slide-banner [data]="bannerData" (back)="nav.pop()"></app-slide-banner>

  <div class="body-content ion-padding">
    <app-scd-page-info [data]="infoData"></app-scd-page-info>
  </div>

  <div class="body-content ion-padding">


    <div class="line"></div>
    <div class="cource-details-box-78561">
      <div class="cource-time-and-lessons-78562">
        <div class="cource-time-box-78563">
          <img class="img1-789575" src="../../../assets/svg/time.svg" />
          {{duration}} hour each lesson
        </div>
        <div class="cource-lesson-box-78564">
          <img class="img1-789575" src="../../assets/svg/create-course.svg" />
          Total {{lessons}} lessons
        </div>
      </div>
      <div class="cource-time-and-lessons-78562">
        <div class="cource-time-box-78563">
          <img class="i-7685" src="../../../assets/svg/online.svg" />{{mode_type}}
        </div>
        <div class="cource-lesson-box-78564">
          <img class="i-7685" src="assets/icon/smgroup-icon.svg" />{{capacity}}
        </div>
      </div>
      <div class="cource-time-and-lessons-78562">
        <div class="cource-time-box-78563">
          <img class="img1-789575" src="../../../assets/svg/cake.svg" />Student
          age {{from_age}}-{{to_age}}
        </div>
        <div class="cource-lesson-box-78564">
          <img src="../../assets/svg/speaks.svg" alt="" style="height: 16px" />{{language}}
        </div>
      </div>
      <div class="cource-time-and-lessons-78562">
        <div class="cource-time-box-78563">
          <img class="i-7685" src="../../../assets/svg/locations.svg" />
          <div style="width: 136px; text-wrap: wrap">
            {{state}}, {{country}}
          </div>
        </div>
        <div class="cource-lesson-box-78564">
          <img class="i-7685" src="../../../assets/svg/course-type.svg" />Workshop/Event
        </div>
      </div>
    </div>
    <div class="line"></div>
    <div class="detail-box-outer-78522">
      <div class="detail-head-78523">
        <div class="detail-heading-78524">Details</div>
        <div class="detail-heading-left--78524 to-end-dates-included" *ngIf="startDate">
          <img src="../../assets/svg/calander.svg" alt="" style="height: 16px" />{{startDate}} {{ endDate ? 'to' : '' }}
          {{endDate}}
        </div>
      </div>
      <app-global-text-read [text]="description"></app-global-text-read>

    </div>

    <div class="line"></div>
    <app-material-attachments [materialId]="materialId"></app-material-attachments>


    <div class="line" *ngIf="otherMaterialListTotalCount > 0"></div>
    <app-other-courses *ngIf="otherMaterialListTotalCount > 0" [count]="otherMaterialListTotalCount"
      [list]="otherMaterialList" (openOtherCourses)="openOtherCourses($event)"
      (onChange)="getOtherCourse($event)"></app-other-courses>

    <app-my-ratings [data]="ratingData"></app-my-ratings>

    <div class="footer-buttons-78963 ion-padding">
      <app-sd-button-clear class="footer-button-1" [text]="'$7/Hr'"></app-sd-button-clear>
      <app-sd-button-golden class="footer-button-2" [image]="'assets/svg/send-message.svg'" [text]="'Message'"
        (click)="goToChat()"></app-sd-button-golden>
    </div>

  </div>
</ion-content>
