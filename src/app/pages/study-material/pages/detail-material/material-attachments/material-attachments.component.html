<div class="student-box-outer-689567">
  <div class="sb-heading-7895">
    <div class="sb-heading-title-7895 outfit-semibold">
      Attachments ({{list.length}})
    </div>
    <div class="download-all-container" *ngIf="isPurchased > 0; else addToCartTemplate">
      <img src="assets/svg/download-all.svg" />
      <div
        class="sb-heading-sl-7895 outfit download-all-btn"
        (click)="downloadAll()">
        Download All
      </div>
    </div>
    <ng-template #addToCartTemplate>
      <div class="download-all-container">
        <img src="assets/svg/cart.svg" />
        <div
          class="sb-heading-sl-7895 outfit add-to-cart-btn"
          (click)="addToCart()">
          Add to Cart
        </div>
      </div>
    </ng-template>

  </div>
  <div class="sb-content-7895"></div>
</div>
<app-attachment-list [list]="list" (onChange)="getOtherCourse($event)"></app-attachment-list>
