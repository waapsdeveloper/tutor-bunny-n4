<ion-content
  ><app-global-list-view
    [list]="list"
    [itemTemplate]="itemTemplate"
    (refresh)="handleRefresh($event)"
    (loadMore)="onIonInfinite($event)"
  >
    <ng-template #itemTemplate let-item>
      <app-generic-teacher-card
        [item]="item"
        (openDetails)="openDetails(item)"
      ></app-generic-teacher-card>
    </ng-template> </app-global-list-view
></ion-content>
