<div class="line" *ngIf="schedules.length !== 0"></div>
<div class="detail-box-outer-78522" *ngIf="schedules.length !== 0">
  <div class="detail-head-785234">
    <div class="detail-heading-78524 outfit-medium">
      Weekly Schedule
    </div>
    <div class="days-box">
      <app-course-schedules *ngFor="let item of schedules; let i = index" [item]="item"
        [last]="i === (schedules.length - 1)"></app-course-schedules>
    </div>
  </div>
</div>
