<div class="dashboard-top-fixed-98563 ">
  <div class="header-chips">
    <div class="header-chip">
      <div class="ion-chip" [class.active-class]="view === 'course'" [class.inactive-class]="view !== 'course'"
        (click)="toogleView('course')"><img src="assets/icon/home/my-corces.svg" alt="">Courses</div>
      <div class="ion-chip" [class.active-class]="view === 'teacher'" [class.inactive-class]="view !== 'teacher'"
        (click)="toogleView('teacher')"><img src="assets/svg/top-teacher.svg" alt="">Teachers</div>
      <div class="ion-chip" [class.active-class]="view === 'notes'" [class.inactive-class]="view !== 'notes'"
        (click)="toogleView('notes')"><img src="assets/svg/studey-notes.svg" alt="">Study Notes</div>
    </div>
  </div>
</div>
<!-- ion-content without scroll -->
<ion-content [scrollY]="false">
  <!-- <ion-router-outlet></ion-router-outlet> -->

  <swiper [slidesPerView]="1" [spaceBetween]="10" [pagination]="{ clickable: true }"
    class="swiper-container-inner-78967852" #slides (transitionEnd)="onSlideChanged()">
    <ng-template swiperSlide>
      <app-student-dashborad-courses style="height: 100%; width: 100%;"></app-student-dashborad-courses>
    </ng-template>
    <ng-template swiperSlide>
      <app-student-dashborad-teachers style="height: 100%; width: 100%;"></app-student-dashborad-teachers>
    </ng-template>
    <ng-template swiperSlide>
      <app-student-dashboard-study-material style="height: 100%; width: 100%;"></app-student-dashboard-study-material>
    </ng-template>
  </swiper>

</ion-content>
