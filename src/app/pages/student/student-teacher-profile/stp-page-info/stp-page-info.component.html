<div class="techer-subject-content">
  <div class="techer-card-outer-78965">
    <div class="teacher-card-head">
      <img src="assets/svg/techer-card.svg" alt="">
      <div class="fs-16 roboto-regular">Teaches:</div>
    </div>
    <div class="chips-outer">
      <div class="chip-outer-78961 fs-16 roboto-regular" *ngFor="let item of subjects">{{item?.name}}</div>
    </div>
  </div>
  <div class="techer-card-outer-78965">
    <div class="teacher-card-head">
      <img src="assets/svg/speaks.svg" alt="">
      <div class="fs-16 roboto-regular">Speaks:</div>
    </div>
    <div class="chips-outer">
      <div class="chip-outer-78961 fs-16 roboto-regular" *ngFor="let item of languages">{{item?.name}}</div>
    </div>
  </div>
  <div class="techer-card-outer-78965">
    <div class="teacher-card-head">
      <img src="../../assets/svg/bike.svg" alt="">
      <div class="fs-16 roboto-regular">Travel:</div>
    </div>
    <div class="chips-outer">
      {{travel_policy}}
    </div>
  </div>
  <div class="techer-card-outer-78965">
    <div class="teacher-card-head">
      <img src="../../assets/svg/locations.svg" alt="">
      <div class="fs-16 roboto-regular" style="text-wrap: nowrap;"><span>{{city}}, {{state}},
          {{country}}</span><span *ngIf="flag" slot="start" class="fi fi-{{flag}}" style="margin-left: 8px;"></span>
      </div>
    </div>
  </div>
</div>
