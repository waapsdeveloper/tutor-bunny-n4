<ion-header class="ion-no-border ion-no-shadow">
  <app-sd-header-top [showBack]="true" [title]="'Course Details'" [backUrl]="backUrl" [showEdit]="canEditCourse"
    (parentEdit)="openDetails()" [showShare]="true"></app-sd-header-top>
</ion-header>

<ion-content class="ion-content-bg " [fullscreen]="true">


  <app-course-photos [course_Id]="course_Id"></app-course-photos>
  <div class="body-content ion-padding">


    <div class="course-heading-78521">
      {{title}}
    </div>
    <div class="cource-price-and-rating-box-78541">
      <div class="cource-price--78542">{{currencySymbol}} {{price}} <span style="font-size: 12px;"> /month</span></div>
      <div class="cource-rating-box-78543">
        <div class="cource-rating-stars-78544" *ngFor=" let iem of [1,2,3,4,5]"><img src="../../assets/svg/star.svg"
            alt=""></div>
        <div class="cource-rating-number-78545">5.0 <span style="font-size: 12px; color: #7C7B7B;">(375)</span></div>
      </div>
    </div>
    <div class="line"></div>
    <div class="cource-details-box-78561">
      <div class="cource-time-and-lessons-78562">
        <div class="cource-time-box-78563"><img class="img1-789575" src="../../../assets/svg/time.svg" /> {{duration}}
          hour each lesson</div>
        <div class="cource-lesson-box-78564"><img class="img1-789575" src="../../assets/svg/create-course.svg" /> Total
          {{lessons}} lessons
        </div>
      </div>
      <div class="cource-time-and-lessons-78562">
        <div class="cource-time-box-78563"><img class="i-7685" src="../../../assets/svg/online.svg" />{{mode_type}}
        </div>
        <div class="cource-lesson-box-78564"> <img class="i-7685" src="assets/icon/smgroup-icon.svg" />{{capacity}}
        </div>
      </div>
      <div class="cource-time-and-lessons-78562">
        <div class="cource-time-box-78563"> <img class="img1-789575" src="../../../assets/svg/cake.svg" />Student age
          {{from_age}}-{{to_age}}</div>
        <div class="cource-lesson-box-78564"> <img src="../../assets/svg/speaks.svg" alt=""
            style="height: 16px;">{{language}}</div>
      </div>
    </div>
    <div class="line"></div>
    <div class="detail-box-outer-78522">
      <div class="detail-head-78523">
        <div class="detail-heading-78524">Details</div>
        <div class="detail-heading-left--78524"
          style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; color: #7A7A7A;">
          <img src="../../assets/svg/calander.svg" alt="" style="height: 16px;">{{startDate}} to {{endDate}}
        </div>
      </div>
      <div class="fs-16 outfit discription-text">
        <div class="discription-para" [class.collapsed]="isExpanded" [innerHTML]="description">

        </div>
        <ion-button class="read-more" fill="clear" *ngIf="!isExpanded" (click)="toggleReadMore()">Read more</ion-button>
        <ion-button class="read-more" fill="clear" *ngIf="isExpanded" (click)="toggleReadMore()">Read less</ion-button>
      </div>
    </div>
    <div class="line" *ngIf="schedules != 0"></div>
    <div class="detail-box-outer-78522" *ngIf="schedules != 0">
      <div class="detail-head-785234" *ngIf="schedules != 0">
        <div class="detail-heading-78524 outfit-medium" *ngIf="type != 3">
          Weekly Schedule
        </div>
        <div class="detail-heading-78524 outfit-medium" *ngIf="type == 3">
          Event Schedule
        </div>
        <div class="days-box">
          <app-course-schedules *ngFor="let item of schedules" [item]="item"></app-course-schedules>
        </div>
      </div>
    </div>
    <div class="line"></div>

    <app-other-courses *ngIf="otherCourseListTotalCount > 0" [count]="otherCourseListTotalCount"
      [list]="otherCourseList" (openOtherCourses)="openOtherCourses($event)" (onChange)="getOtherCourse($event)"></app-other-courses>
  </div>
</ion-content>
