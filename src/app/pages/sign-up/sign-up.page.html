<div class="body-content-68448">
  <div class="input-box-lines d-flex flex-column gap-8">
    <!-- <app-sd-input-box
      [image]="'assets/svg/name.svg'"
      placeholder="Enter your Name"
      (onChange)="result($event, 'name')"
      [inputText]="formData.name"
      [key]="'name'"
      [modernInput]="true"
      [errorText]="'Name is required'"
    ></app-sd-input-box> -->
  </div>
  <div class="input-box-lines d-flex flex-column gap-8">
    <app-sd-input-box
      [image]="'assets/svg/email.svg'"
      placeholder="Enter your email"
      (onChange)="result($event, 'email')"
      [inputText]="formData.email"
      [key]="'email'"
      [errorText]="'Email is required'"
      [type]="'email'"
      [modernInput]="true"
    ></app-sd-input-box>
  </div>
  <div class="input-box-lines d-flex flex-column gap-8">
    <app-sd-input-box
      [showTogglePassword]="true"
      [image]="'assets/svg/password.svg'"
      placeholder="Enter your password"
      (onChange)="result($event, 'password')"
      [inputText]="formData.password"
      [key]="'password'"
      [errorText]="'Password is required'"
      [type]="'password'"
      [modernInput]="true"
    ></app-sd-input-box>
  </div>

  <div class="input-box-lines d-flex flex-column gap-8">
    <app-sd-input-box
      [showTogglePassword]="true"
      [image]="'assets/svg/password.svg'"
      placeholder="Re-enter your password"
      (onChange)="result($event, 'confirm_password')"
      [inputText]="formData.confirm_password"
      [modernInput]="true"
      [key]="'confirm_password'"
      [errorText]="'Confirm Password is required'"
      [type]="'password'"
    ></app-sd-input-box>
  </div>
  <div class="d-flex flex-column gap-16">
    <div class="input-box-lines">
      <app-sd-button-gray
        [text]="'Register'"
        (click)="SignUpWithEmail()"
      ></app-sd-button-gray>
    </div>
  </div>
</div>
