<ion-header class="ion-no-border ion-no-shadow">
  <div class="top-header-78956">
    <div class="header-left-items-78956">
      <app-sd-bback-btn (click)="back()"></app-sd-bback-btn>
      <div class="header-image-78415"
        [style.background-image]="image ? 'url(' + image + ')' : 'assets/profileimg.png'">
      </div>
      <div style="display: flex; align-items: flex-start; flex-direction: column;
      gap: 8px;">
        <div class="header-title ">
          <div>{{displayName}}</div> <span *ngIf="flag" slot="start" class="fi fi-{{flag}}"></span>
        </div>
        <div class="chat-online-98529"><img src="../../assets/svg/active-staties.svg" alt="">Online</div>
      </div>
    </div>
    <div class="header-right-items-78956">
      <div class="bsearch-btn-7895 ion-activatable ripple-parent rectangle">
        <ion-ripple-effect></ion-ripple-effect>
        <img src="../../assets/svg/options.svg" />
      </div>
    </div>
  </div>
</ion-header>
<ion-content #content class="ion-content-bg ion-padding">
  <div class="body-content" *ngFor="let item of days">
    <div class="chat-day-heading-85621" *ngIf="item.date">
      <div style="padding: 8px;
      background: antiquewhite;
      border-radius: 8px;">{{item.date}}</div>
    </div>
    <app-message-list *ngFor="let chat of item.messages" [chat]="chat"></app-message-list>
  </div>
</ion-content>
<ion-footer>
  <div class="footer-box-78521">
    <div class="input-box-78522">
      <input #messageInput type="text" placeholder="Write your text here" style="background: white;"
        (keyup)="onKeyUp($event)">
      <!-- <img src="../../assets/svg/addImgae.svg" alt=""> -->
    </div>
    <div class="send-box-78522">
      <img src="../../assets/svg/sent.svg" alt="" (click)="sendMessage()">
    </div>
  </div>
</ion-footer>
