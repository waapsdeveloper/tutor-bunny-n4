<ion-header class="ion-no-border ion-no-shadow">
  <app-sd-header-top [showBack]="true" [title]="'My Students'"
    [backUrl]="'/tabs/teacher-dashboard'"></app-sd-header-top>
</ion-header>
<ion-content class="ion-content-bg ion-padding" [fullscreen]="true">
  <div class="body-content">
    <div class="search-box-outer-89655">
      <div class="search-box-input-outer">
        <img src="assets/icon/input-search-gray.svg" />
        <input type="text" placeholder="Search Students" />
      </div>
    </div>
    <div class="dashboard-top-fixed-98563">
      <div class="header-chips">
        <div class="header-chip">
          <!-- <ion-chip style="color: #F17401;">New</ion-chip>
          <ion-chip style="color: #17A43E;">Active</ion-chip> -->
          <ion-chip id="click-trigger">Status <img src="../../assets/svg/arrow-dwon.svg" alt=""></ion-chip>
          <ion-popover trigger="click-trigger" triggerAction="click">
            <ng-template>
              <ion-content class="ion-padding">Pending, Accepted, Complete, Rejected, Blocked.</ion-content>
            </ng-template>
          </ion-popover>
        </div>
      </div>
    </div>
    <app-trail-card *ngFor="let item of list" [item]="item"></app-trail-card>
  </div>
</ion-content>
