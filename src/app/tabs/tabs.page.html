<ion-tabs>
  <ion-tab-bar class="ion-tab-bar-67895675" slot="bottom" [class.tab-bar-hight-1]="showTabs"
    [class.tab-bar-hight-0]="!showTabs">
    <ion-tab-button class="ion-tab-button-67895675" [tab]="returnDashboardLink()" (click)="goToHome()">
      <div class="tab-back-78523" *ngIf="showHome == true">
        <img src="assets/icon/home/home-icon.svg" />
      </div>
      <img src="assets/icon/home/home-icon.svg" *ngIf="showHome == false"/>
      <div class="footer-tab-label">Home</div>
    </ion-tab-button>
    <ion-tab-button class="ion-tab-button-67895675" tab="chat" (click)="goToChat()">
      <div class="tab-back-78523" *ngIf="showChat == true">
        <img src="assets/icon/home/chat-icon.svg" />
      </div>
      <img src="assets/icon/home/chat-icon.svg" *ngIf="showChat == false" />
      <div class="footer-tab-label">Chat</div>
    </ion-tab-button>
    <ion-tab-button class="ion-tab-button-67895675" *ngIf="roleId == 3" (click)="createCourse()">
      <img src="../../assets/svg/add-course.svg" />
      <div class="footer-tab-label">Create</div>
    </ion-tab-button>
    <ion-tab-button class="ion-tab-button-67895675" *ngIf="roleId == 2" tab="my-teachers" (click)="goToSearch()">
      <div class="tab-back-78523" *ngIf="showSearch == true">
        <img src="../../assets/svg/search.svg" />
      </div>
      <img src="../../assets/svg/search.svg" *ngIf="showSearch == false"/>
      <div class="footer-tab-label" >Search</div>
    </ion-tab-button>
    <ion-tab-button class="ion-tab-button-67895675" tab="courses" *ngIf="roleId == 3" (click)="goToCourses()">
      <div class="tab-back-78523" *ngIf="showCourses == true">
        <img src="assets/icon/home/my-corces.svg" />
      </div>
      <img src="assets/icon/home/my-corces.svg" *ngIf="showCourses == false"/>
      <div class="footer-tab-label">My Courses</div>
    </ion-tab-button>
    <ion-tab-button class="ion-tab-button-67895675" *ngIf="roleId == 2">
      <img src="../../assets/svg/trails.svg" />
      <div class="footer-tab-label">Requests</div>
    </ion-tab-button>
    <ion-tab-button class="ion-tab-button-67895675" tab="search" (click)="goToMore()">
      <div class="tab-back-78523" *ngIf="showMore == true">
        <img src="../../assets/svg/more.svg" style="height: 24px; width: 24px;" />
      </div>
      <img src="../../assets/svg/more.svg" *ngIf="showMore == false" style="height: 24px; width: 24px;" />
      <div class="footer-tab-label">More</div>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
