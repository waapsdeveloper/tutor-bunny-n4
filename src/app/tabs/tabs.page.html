<ion-tabs>
  <ion-tab-bar class="ion-tab-bar-67895675" slot="bottom" [class.tab-bar-hight-1]="showTabs" [class.tab-bar-hight-0]="!showTabs" >
    <ion-tab-button class="ion-tab-button-67895675" [tab]="returnDashboardLink()">
      <img src="assets/icon/home/home-icon.svg" />
      <div class="footer-tab-label">Home</div>
    </ion-tab-button>
    <ion-tab-button class="ion-tab-button-67895675" tab="radio">
      <img src="assets/icon/home/chat-icon.svg" />
      <div class="footer-tab-label">Chat</div>
    </ion-tab-button>
    <ion-tab-button class="ion-tab-button-67895675" tab="library">
      <img src="assets/icon/home/calendar-icon.svg" />
      <div class="footer-tab-label">Calendar</div>
    </ion-tab-button>
    <ion-tab-button class="ion-tab-button-67895675" tab="courses">
      <img src="assets/icon/home/my-corces.svg" />
      <div class="footer-tab-label">My Courses</div>
    </ion-tab-button>
    <ion-tab-button class="ion-tab-button-67895675" tab="search">
      <img src="../../assets/svg/more.svg" style="height: 24px; width: 24px;"/>
      <div class="footer-tab-label">More</div>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
