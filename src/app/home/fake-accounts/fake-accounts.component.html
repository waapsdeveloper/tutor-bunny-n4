<ion-list class="ion-margin-top">
  <ion-item *ngFor="let item of list" (click)="openAccount(item)">
    <ion-avatar slot="start">
      <ion-img [src]="item.image"></ion-img>
    </ion-avatar>
    <ion-label>
      <h2>{{item.name}}</h2>
      <p>{{item.email}}</p>
    </ion-label>
    <ion-badge slot="end">{{item.role_id == 2 ? "teacher" : "student"}}</ion-badge>
  </ion-item>
</ion-list>
